<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sevgilim Benim 🤍</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    #title {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      font-family: Arial, sans-serif;
    }
    #subtitle {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      color: #ffb6c1;
      font-size: 18px;
      font-family: Arial, sans-serif;
    }
    #musicBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="title">Sevgilim Benim 🤍</div>
  <div id="subtitle">Öncekini sevmiştin :)</div>
  <button id="musicBtn">Müzik Aç</button>

  <!-- Three.js ve GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- Bizim JS -->
  <script src="app.js"></script>
</body>
</html>
